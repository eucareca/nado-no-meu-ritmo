# SPDX-License-Identifier: Apache-2.0
name: Compilar APK Android

on:
  push:
    branches: [main, feat/treinos-guiados]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obter o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar fonte e executar testes locais
        run: |
          python3 scripts/audit-source.py
          python3 -m venv .venv
          .venv/bin/pip install -r tests/requirements.txt
          .venv/bin/playwright install --with-deps chromium
          .venv/bin/python tests/test_local.py
          .venv/bin/python tests/test_workouts.py
      - name: Instalar as ferramentas Android fixadas pelo projeto
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compilar versão de teste e release sem assinatura
        run: ./scripts/build-apk.sh
      - name: Disponibilizar os APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nado-apks-${{ github.run_number }}
          path: artifacts/apk/
          if-no-files-found: error
          retention-days: 30
      - name: Explicar os arquivos gerados
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## APKs gerados
          Baixe o pacote **nado-apks** em Artifacts, no final desta página.
          - **nado-teste.apk**: instalável como outro aplicativo, com “(teste)” no nome. Não altera o diário já instalado.
          - **nado-release-unsigned.apk**: precisa ser assinado com a chave original para atualizar o aplicativo existente.
          - **SHA256SUMS.txt** e **preview-signature.txt**: conferência dos arquivos e do certificado de teste.
          O teste usa uma chave de depuração descartável. Não é um canal de atualizações estáveis. Não desinstale seu diário principal. Faça um backup nele e importe uma cópia no teste se desejar.
          EOF
