plugins {
    id "com.android.application"
}

android {
    namespace "br.com.tabinformatica.nadonomeritmo"
    compileSdk 36
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "br.com.tabinformatica.nadonomeritmo"
        minSdk 23
        targetSdk 36
        versionCode 10
        versionName "1.9.0"
        manifestPlaceholders = [appLabel: "Nado no meu ritmo"]
    }

    buildTypes {
        debug {
            if (providers.gradleProperty("nadoPreview").orNull == "true") {
                applicationIdSuffix ".preview"
                versionNameSuffix "-teste"
                manifestPlaceholders = [appLabel: "Nado no meu ritmo (teste)"]
            }
        }
    }
}
